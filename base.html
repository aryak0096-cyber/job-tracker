<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Tracker{% endblock %} · Job Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('views.dashboard') }}">Job<span>Tracker</span></a>
    <nav>
      <a href="{{ url_for('views.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('views.applications') }}">Applications</a>
      <a href="{{ url_for('views.resume') }}">Resume</a>
      <a href="{{ url_for('views.analyze') }}">Analyzer</a>
      <a class="btn btn-small" href="{{ url_for('views.new_application') }}">+ Add</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
